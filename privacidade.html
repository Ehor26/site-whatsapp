<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Política de Privacidade - Sansaflow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --brand: #25D366;
      --bg: #f6f7f9;
      --text: #1f2937;
      --muted: #6b7280;
      --card: #ffffff;
      --border: #e5e7eb;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    header {
      background: var(--brand);
      color: #fff;
      padding: 44px 18px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px 0; font-size: 28px; }
    header p { margin: 0; opacity: 0.95; }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 18px;
      margin: 16px 0;
    }

    h2 { margin: 18px 0 8px 0; font-size: 20px; }
    h3 { margin: 16px 0 6px 0; font-size: 16px; }
    .muted { color: var(--muted); font-size: 14px; }

    a {
      color: var(--brand);
      font-weight: bold;
      text-decoration: none;
    }

    ul { margin: 10px 0 10px 22px; }
    code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 6px;
    }

    footer {
      text-align: center;
      padding: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .pill {
      display: inline-block;
      background: #ffffff33;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>

  </header>
