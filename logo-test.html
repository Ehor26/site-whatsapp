<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sansaflow - Logo Fusion</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Inter, Arial, sans-serif;
  background: linear-gradient(135deg,#0f172a,#1e1b4b,#0f172a);
  background-size:400% 400%;
  animation: bgMove 15s ease infinite;
  color:white;
  text-align:center;
}

@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.container{
  padding:120px 20px;
}

.logo-box{
  margin:auto;
  padding:60px;
  max-width:300px;
  border-radius:25px;
  background:rgba(255,255,255,0.05);
  backdrop-filter: blur(14px);
  border:1px solid rgba(255,255,255,0.1);
  transition:0.4s;
}

.logo-box:hover{
  transform:translateY(-10px);
  box-shadow:0 0 60px rgba(109,40,217,0.7);
}

h1{
  margin-bottom:60px;
  font-weight:700;
  letter-spacing:1px;
}

/* Glow geral */
svg{
  filter: drop-shadow(0 0 20px rgba(109,40,217,.7));
}
</style>
</head>

<body>

<div class="container">
<h1>Logo Fusion - Sansaflow</h1>

<div class="logo-box">

<svg width="120" height="120" viewBox="0 0 100 100">

<defs>
<linearGradient id="luxTech" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#FFD700"/>
<stop offset="50%" stop-color="#6D28D9"/>
<stop offset="100%" stop-color="#2563EB"/>
</linearGradient>
</defs>

<!-- Estrutura Luxo (base do 4) -->
<polygon points="50,5 95,50 50,95 5,50"
         fill="none"
         stroke="url(#luxTech)"
         stroke-width="4"/>

<!-- Núcleo Inteligente (base do 3) -->
<circle cx="50" cy="50" r="10" fill="url(#luxTech)"/>
<circle cx="50" cy="50" r="22"
        stroke="url(#luxTech)"
        stroke-width="2"
        fill="none"
        opacity="0.8"/>

<circle cx="50" cy="50" r="35"
        stroke="url(#luxTech)"
        stroke-width="1.5"
        fill="none"
        opacity="0.4"/>

</svg>

</div>

</div>

</body>
</html>
