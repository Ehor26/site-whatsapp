<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sansaflow — V2.2 Ouro Premium</title>

<style>
body{
  margin:0;
  background: radial-gradient(circle at 30% 30%, #1e1b4b, #0b1220 70%);
  font-family: Inter, Arial, sans-serif;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:80px 20px;
}

h1{
  margin-bottom:60px;
  font-weight:800;
  letter-spacing:.5px;
}

.grid{
  display:flex;
  gap:80px;
  flex-wrap:wrap;
  justify-content:center;
}

.card{
  text-align:center;
}

svg{
  filter: drop-shadow(0 0 30px rgba(0,0,0,.6));
}

.label{
  margin-bottom:20px;
  font-weight:600;
  opacity:.85;
}
</style>
</head>

<body>

<h1>Sansaflow — V2.2 Ouro Premium</h1>

<div class="grid">

  <!-- =========================
       V2.2A — Ouro Premium Verde
       ========================= -->
  <div class="card">
    <div class="label">V2.2A — Ouro Premium</div>

    <svg width="160" height="160" viewBox="0 0 120 120">
      <defs>

        <!-- Degradê Tech Original -->
        <linearGradient id="orig" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7c3aed"/>
          <stop offset="55%" stop-color="#2563eb"/>
          <stop offset="100%" stop-color="#22d3ee"/>
        </linearGradient>

        <!-- OURO PREMIUM ESVERDEADO -->
        <linearGradient id="goldPremium" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFF9D6"/>
          <stop offset="25%" stop-color="#E7C873"/>
          <stop offset="55%" stop-color="#C6A84A"/>
          <stop offset="75%" stop-color="#A38A2E"/>
          <stop offset="100%" stop-color="#6E5F17"/>
        </linearGradient>

      </defs>

      <!-- Losango -->
      <polygon points="60,4 116,60 60,116 4,60"
        fill="none"
        stroke="url(#orig)"
        stroke-width="4.5"
        opacity="0.95"/>

      <!-- Núcleo Ouro Premium -->
      <circle cx="60" cy="60" r="10"
        fill="url(#goldPremium)"/>

      <!-- Esfera média -->
      <circle cx="60" cy="60" r="24"
        stroke="url(#orig)"
        stroke-width="2.2"
        fill="none"
        opacity="0.9"/>

      <!-- Círculo maior -->
      <circle cx="60" cy="60" r="36"
        stroke="url(#orig)"
        stroke-width="1.9"
        fill="none"
        opacity="0.45"/>
    </svg>
  </div>


  <!-- =========================
       V2.2B — Ouro Premium + Reflexo
       ========================= -->
  <div class="card">
    <div class="label">V2.2B — Ouro Premium + Reflexo</div>

    <svg width="160" height="160" viewBox="0 0 120 120">
      <defs>

        <linearGradient id="orig2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7c3aed"/>
          <stop offset="55%" stop-color="#2563eb"/>
          <stop offset="100%" stop-color="#22d3ee"/>
        </linearGradient>

        <!-- Ouro Premium -->
        <linearGradient id="goldPremium2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFFCE6"/>
          <stop offset="30%" stop-color="#E7C873"/>
          <stop offset="60%" stop-color="#C6A84A"/>
          <stop offset="100%" stop-color="#6E5F17"/>
        </linearGradient>

        <!-- REFLEXO DINÂMICO -->
        <radialGradient id="shine">
          <stop offset="0%" stop-color="white" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="white" stop-opacity="0"/>
        </radialGradient>

      </defs>

      <!-- Losango -->
      <polygon points="60,4 116,60 60,116 4,60"
        fill="none"
        stroke="url(#orig2)"
        stroke-width="4.5"
        opacity="0.95"/>

      <!-- Núcleo Ouro Premium -->
      <circle cx="60" cy="60" r="10"
        fill="url(#goldPremium2)"/>

      <!-- Reflexo animado -->
      <circle cx="60" cy="50" r="5" fill="url(#shine)">
        <animate attributeName="cy"
                 values="50;60;50"
                 dur="3s"
                 repeatCount="indefinite"/>
      </circle>

      <!-- Esfera média -->
      <circle cx="60" cy="60" r="24"
        stroke="url(#orig2)"
        stroke-width="2.2"
        fill="none"
        opacity="0.9"/>

      <!-- Círculo maior -->
      <circle cx="60" cy="60" r="36"
        stroke="url(#orig2)"
        stroke-width="1.9"
        fill="none"
        opacity="0.45"/>
    </svg>
  </div>

</div>

</body>
</html>
