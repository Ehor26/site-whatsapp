<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sansaflow — V2.2 Original</title>

<style>
  :root{
    --bg1:#0b1220;
    --bg2:#1b1550;
    --bg3:#0b1220;
  }
  body{
    margin:0;
    font-family: Inter, Arial, sans-serif;
    color:#fff;
    background: linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    background-size:400% 400%;
    animation:bgMove 14s ease infinite;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:40px 16px;
  }
  @keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .card{
    width:min(520px, 100%);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 34px 22px 26px;
    backdrop-filter: blur(14px);
    box-shadow: 0 18px 60px rgba(0,0,0,.55);
    text-align:center;
  }
  h1{
    margin:0 0 10px;
    font-size:22px;
    font-weight:800;
    letter-spacing:.4px;
  }
  p{
    margin:0 0 22px;
    opacity:.78;
    font-size:13px;
  }
  svg{
    filter: drop-shadow(0 0 18px rgba(109,40,217,.55));
  }
</style>
</head>

<body>
  <div class="card">
    <h1>V2.2 — Centro Original</h1>
    <p>Voltando ao núcleo original (degradê tech).</p>

    <svg width="180" height="180" viewBox="0 0 120 120" aria-label="Logo V2.2 Original">
      <defs>
        <!-- Degradê ORIGINAL -->
        <linearGradient id="orig" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7c3aed"/>
          <stop offset="55%" stop-color="#2563eb"/>
          <stop offset="100%" stop-color="#22d3ee"/>
        </linearGradient>
      </defs>

      <!-- Losango -->
      <polygon points="60,4 116,60 60,116 4,60"
        fill="none"
        stroke="url(#orig)"
        stroke-width="4.5"
        opacity="0.95"/>

      <!-- Núcleo ORIGINAL -->
      <circle cx="60" cy="60" r="10"
        fill="url(#orig)"/>

      <!-- Esfera média -->
      <circle cx="60" cy="60" r="24"
        stroke="url(#orig)"
        stroke-width="2.2"
        fill="none"
        opacity="0.9"/>

      <!-- Círculo maior -->
      <circle cx="60" cy="60" r="36"
        stroke="url(#orig)"
        stroke-width="1.9"
        fill="none"
        opacity="0.45"/>
    </svg>
  </div>
</body>
</html>
