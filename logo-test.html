<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sansaflow Identity Test</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Inter, sans-serif;
  background:#0B0F19;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow:hidden;
}

/* Fundo com degradê profundo */
.bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 30% 30%, rgba(109,40,217,.25), transparent 40%),
    radial-gradient(circle at 70% 60%, rgba(37,99,235,.25), transparent 45%),
    #0B0F19;
}

/* Luz animada */
.light{
  position:absolute;
  width:600px;
  height:600px;
  background:radial-gradient(circle, rgba(255,255,255,.15), transparent 60%);
  filter:blur(80px);
  animation:moveLight 8s infinite alternate ease-in-out;
}

@keyframes moveLight{
  from{transform:translate(-200px,-100px);}
  to{transform:translate(200px,150px);}
}

/* Logo */
.logo{
  position:relative;
  font-size:64px;
  font-weight:900;
  letter-spacing:-2px;
  color:white;
}

.logo span{
  background:linear-gradient(90deg,#2563EB,#6D28D9);
  -webkit-background-clip:text;
  color:transparent;
}

.sub{
  position:absolute;
  bottom:-20px;
  right:0;
  font-size:14px;
  letter-spacing:4px;
  color:rgba(255,255,255,.5);
}

</style>
</head>
<body>

<div class="bg"></div>
<div class="light"></div>

<div class="logo">
  Sansa<span>flow</span>
  <div class="sub">AI • AUTOMATION • PERFORMANCE</div>
</div>

</body>
</html>
