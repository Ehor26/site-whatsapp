<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de Logos - Sansaflow</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Inter, sans-serif;
  background:#0B0F19;
  color:#F9FAFB;
  padding:40px;
}

h1{
  font-size:28px;
  margin-bottom:40px;
}

.section{
  margin-bottom:60px;
}

.card{
  background:#111827;
  padding:30px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.08);
  display:flex;
  gap:40px;
  align-items:center;
  flex-wrap:wrap;
}

.label{
  font-size:14px;
  opacity:.6;
  margin-bottom:15px;
}

.logoBox{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
}
</style>
</head>
<body>

<h1>Teste de Logos - Sansaflow</h1>

<div class="section">
<div class="label">Logo 1 - Monograma S (Luxo Premium)</div>
<div class="card">

<div class="logoBox">
<svg viewBox="0 0 64 64" width="80" height="80" fill="none">
<defs>
<linearGradient id="g1" x1="8" y1="8" x2="56" y2="56">
<stop stop-color="#2563EB"/>
<stop offset="1" stop-color="#6D28D9"/>
</linearGradient>
</defs>
<rect x="6" y="6" width="52" height="52" rx="16" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.12)"/>
<path d="M41.8 21.6c-1.9-2-5-3.1-9.2-3.1-6.5 0-10.6 2.6-10.6 7.1 0 4 3.1 5.8 9.8 6.6 5.6.7 6.8 1.6 6.8 3.2 0 2-2.3 3.1-6.1 3.1-3.6 0-6.5-1-8.2-3.1"
stroke="url(#g1)" stroke-width="4.2" stroke-linecap="round"/>
</svg>
</div>

</div>
</div>

<div class="section">
<div class="label">Logo 2 - Flow Mark (Movimento)</div>
<div class="card">

<div class="logoBox">
<svg viewBox="0 0 64 64" width="80" height="80" fill="none">
<defs>
<linearGradient id="g2" x1="10" y1="10" x2="54" y2="54">
<stop stop-color="#6D28D9"/>
<stop offset="1" stop-color="#2563EB"/>
</linearGradient>
</defs>
<rect x="6" y="6" width="52" height="52" rx="16" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.12)"/>
<path d="M18 26c6-10 22-10 28 0" stroke="url(#g2)" stroke-width="4" stroke-linecap="round"/>
<path d="M46 38c-6 10-22 10-28 0" stroke="url(#g2)" stroke-width="4" stroke-linecap="round"/>
<circle cx="18" cy="26" r="2.6" fill="#C6A75E"/>
<circle cx="46" cy="38" r="2.6" fill="#C6A75E"/>
</svg>
</div>

</div>
</div>

<div class="section">
<div class="label">Logo 3 - Neural (IA / Neuro)</div>
<div class="card">

<div class="logoBox">
<svg viewBox="0 0 64 64" width="80" height="80" fill="none">
<defs>
<linearGradient id="g3" x1="10" y1="10" x2="54" y2="54">
<stop stop-color="#2563EB"/>
<stop offset="1" stop-color="#6D28D9"/>
</linearGradient>
</defs>
<rect x="6" y="6" width="52" height="52" rx="16" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.12)"/>
<path d="M22 40l10-16 10 16" stroke="url(#g3)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="22" cy="40" r="3" fill="#C6A75E"/>
<circle cx="32" cy="24" r="3" fill="#C6A75E"/>
<circle cx="42" cy="40" r="3" fill="#C6A75E"/>
</svg>
</div>

</div>
</div>

</body>
</html>
