<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sansaflow - Logo Control</title>

<style>
  :root{
    --bg1:#0b1220;
    --bg2:#1b1550;
    --bg3:#0b1220;
  }

  body{
    margin:0;
    font-family: Inter, Arial, sans-serif;
    color:#fff;
    background: linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    background-size:400% 400%;
    animation:bgMove 14s ease infinite;
  }

  @keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:70px 18px 90px;
  }

  .title{
    text-align:center;
    font-weight:800;
    margin-bottom:8px;
  }

  .subtitle{
    text-align:center;
    opacity:.8;
    margin-bottom:40px;
  }

  .controlBox{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.15);
    padding:20px;
    border-radius:18px;
    margin-bottom:40px;
    text-align:center;
  }

  .controlBox label{
    font-weight:600;
    display:block;
    margin-bottom:10px;
  }

  input[type=range]{
    width:320px;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:18px;
  }

  .card{
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 22px;
    padding: 26px 20px 22px;
    backdrop-filter: blur(14px);
    transition: .35s ease;
    text-align:center;
  }

  .card:hover{
    transform: translateY(-6px);
    box-shadow: 0 18px 60px rgba(0,0,0,.55);
  }

  .label{
    font-weight:700;
    margin-bottom:14px;
  }

  svg{
    filter: drop-shadow(0 0 18px rgba(109,40,217,.55));
  }

  @media (max-width: 920px){
    .grid{ grid-template-columns: 1fr; }
  }
</style>
</head>

<body>
<div class="wrap">

<h1 class="title">Sansaflow — Controle de Losango</h1>
<p class="subtitle">Arraste o slider para aumentar ou diminuir o losango em tempo real.</p>

<div class="controlBox">
  <label>Tamanho do Losango: <span id="sizeValue">56</span></label>
  <input type="range" min="40" max="70" value="56" id="diamondSlider">
</div>

<div class="grid">

<!-- V1 -->
<div class="card">
<div class="label">V1 — Losango ouro</div>
<svg width="140" height="140" viewBox="0 0 120 120">
<defs>
<linearGradient id="origV1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#7c3aed"/>
<stop offset="55%" stop-color="#2563eb"/>
<stop offset="100%" stop-color="#22d3ee"/>
</linearGradient>
<linearGradient id="goldV1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#FFD700"/>
<stop offset="50%" stop-color="#FFB800"/>
<stop offset="100%" stop-color="#F59E0B"/>
</linearGradient>
</defs>

<polygon id="diamondV1"
points="60,4 116,60 60,116 4,60"
fill="none"
stroke="url(#goldV1)"
stroke-width="4.5"/>

<circle cx="60" cy="60" r="9.5" fill="url(#origV1)"/>
<circle cx="60" cy="60" r="24" stroke="url(#origV1)" stroke-width="2.2" fill="none"/>
<circle cx="60" cy="60" r="36" stroke="url(#origV1)" stroke-width="1.9" fill="none" opacity="0.45"/>
</svg>
</div>

<!-- V2 -->
<div class="card">
<div class="label">V2 — Centro ouro</div>
<svg width="140" height="140" viewBox="0 0 120 120">
<defs>
<linearGradient id="origV2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#7c3aed"/>
<stop offset="55%" stop-color="#2563eb"/>
<stop offset="100%" stop-color="#22d3ee"/>
</linearGradient>
<linearGradient id="goldV2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#FFD700"/>
<stop offset="50%" stop-color="#FFB800"/>
<stop offset="100%" stop-color="#F59E0B"/>
</linearGradient>
</defs>

<polygon id="diamondV2"
points="60,4 116,60 60,116 4,60"
fill="none"
stroke="url(#origV2)"
stroke-width="4.5"/>

<circle cx="60" cy="60" r="9.5" fill="url(#goldV2)"/>
<circle cx="60" cy="60" r="24" stroke="url(#origV2)" stroke-width="2.2" fill="none"/>
<circle cx="60" cy="60" r="36" stroke="url(#origV2)" stroke-width="1.9" fill="none" opacity="0.45"/>
</svg>
</div>

<!-- V3 -->
<div class="card">
<div class="label">V3 — Anel externo ouro</div>
<svg width="140" height="140" viewBox="0 0 120 120">
<defs>
<linearGradient id="origV3" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#7c3aed"/>
<stop offset="55%" stop-color="#2563eb"/>
<stop offset="100%" stop-color="#22d3ee"/>
</linearGradient>
<linearGradient id="goldV3" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#FFD700"/>
<stop offset="50%" stop-color="#FFB800"/>
<stop offset="100%" stop-color="#F59E0B"/>
</linearGradient>
</defs>

<polygon id="diamondV3"
points="60,4 116,60 60,116 4,60"
fill="none"
stroke="url(#origV3)"
stroke-width="4.5"/>

<circle cx="60" cy="60" r="9.5" fill="url(#origV3)"/>
<circle cx="60" cy="60" r="24" stroke="url(#origV3)" stroke-width="2.2" fill="none"/>
<circle cx="60" cy="60" r="36" stroke="url(#goldV3)" stroke-width="2.2" fill="none" opacity="0.65"/>
</svg>
</div>

</div>
</div>

<script>
const slider = document.getElementById("diamondSlider");
const sizeValue = document.getElementById("sizeValue");

function updateDiamond(radius){
const center = 60;
const top = `${center},${center - radius}`;
const right = `${center + radius},${center}`;
const bottom = `${center},${center + radius}`;
const left = `${center - radius},${center}`;
const points = `${top} ${right} ${bottom} ${left}`;

document.getElementById("diamondV1").setAttribute("points", points);
document.getElementById("diamondV2").setAttribute("points", points);
document.getElementById("diamondV3").setAttribute("points", points);
}

slider.addEventListener("input", function(){
sizeValue.innerText = this.value;
updateDiamond(parseInt(this.value));
});

updateDiamond(parseInt(slider.value));
</script>

</body>
</html>
